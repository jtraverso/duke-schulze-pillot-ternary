name = "dsp_ternary"
version = "0.1.0"
defaultTargets = ["DSPChallenge", "DSPSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "DSPLib"
globs = ["DSPLib.+"]

[[lean_lib]]
name = "DSPChallenge"
roots = ["DSPChallenge"]

[[lean_lib]]
name = "DSPSolution"
roots = ["DSPSolution"]

[[lean_lib]]
name = "ThreeSquaresLib"
globs = ["ThreeSquaresLib.+"]

[[lean_lib]]
name = "rml"
srcDir = "vendor/weil_bounds_toolkit/source"
globs = ["rml.*"]

[[lean_lib]]
name = "LeanLab"
srcDir = "vendor/goldbach_siegel"
globs = ["LeanLab.+"]
