fidelity:
  divergences: 'The paper takes A with even diagonal (so that q is integral) and h with Ah ∈ ℤ³; the upper
    bounds here hold for every symmetric integer A with q > 0 on ℚ³ \ {0} and every h ∈ ℚ³. The spinor
    genus r(spn_N q, h, n) is not defined: average_le covers it as a weighted average of representation
    numbers r(q'', h'', n) with weights 1/o(q'', N), and in thm3_ii and spn_upper it is an arbitrary function
    R constrained only by the hypothesis hThm3i. μ(F) is a real number in [0, 1] constrained only by hThm1;
    the region F is an arbitrary set. The restriction on n (n = t m², t squarefree, gcd(m, N₂^∞) in a
    fixed finite set) is an arbitrary set S on which the hypotheses hold. The O-constants are stated as
    existence of C for each ε > 0. H1 is the fixed-cap nonemptiness consequence on the three-square sphere,
    with coordinatewise distance and an ineffective threshold depending on u and epsilon; it is not a
    sharp rate or the general ellipsoid theorem.'
