  scope: The five earlier endpoints plus unconditional H1 for squarefree three-square radii. H1 supplies
    no numerical threshold and does not remove hThm1 or hThm3i from the general conditional endpoints.
    The full general ternary-form theorem, spinor genera and nonsquarefree three-square cap endpoint are
    outside the selected submission.
