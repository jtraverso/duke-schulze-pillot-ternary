version: v0.4
project:
  name: Duke–Schulze-Pillot bounds and squarefree three squares in fixed caps (H1)
  description: 'A Lean 4 / Mathlib formalization retaining the upper representation bounds and the conditional
    consequence of Duke–Schulze-Pillot (Invent. Math. 99, 1990), and adding an unconditional fixed-cap
    theorem for x^2+y^2+z^2. H1: for every unit vector u in R^3 and every epsilon > 0 there is T such
    that every squarefree t >= T with t congruent to 3 modulo 8 has an integer representation x with sum
    x_i^2=t and |x_i-sqrt(t)u_i| <= epsilon sqrt(t) for every coordinate. The new statement takes no analytic
    estimate as a hypothesis. Its proof combines finite-degree harmonic Weyl bounds, odd-degree cancellation,
    a positive minimum of finitely many degree-dependent savings, and a representation lower bound supplied
    by the verified Siegel theorem. The threshold is ineffective. The original three unconditional upper/divisor
    bounds and two conditional statements are retained unchanged; the latter still require hThm1 and hThm3i
    for general ternary forms. No unconditional general Duke–Schulze-Pillot theorem, sharp 1/175 exponent,
    spinor-genus lower bound or numerical cutoff is claimed.'
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
